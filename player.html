:root{--navy:#16324F;--sky:#4FA3D9;--pale:#EAF5FC;--sun:#F6B93B;--rain:#2E7CC4;--ink:#1d4e89}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}
body{font-family:Nunito,"Arial Rounded MT Bold",Arial,sans-serif;background:var(--pale);color:#1B2A3A;display:flex;flex-direction:column}
button{font-family:inherit;cursor:pointer;border:0;border-radius:12px;font-weight:800}
.b{background:var(--rain);color:#fff;padding:10px 18px;font-size:16px;border-radius:14px;box-shadow:0 4px 0 rgba(0,0,0,.22)}.b:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.22)}.b.y{background:var(--sun);color:var(--navy)}.b.g{background:#5a6b7b}.b.r{background:#c0392b}
.fit{position:relative;overflow:hidden;background:#0B1B33}
.s16{position:absolute;left:0;top:0;width:1600px;height:900px;transform-origin:0 0;overflow:hidden;color:var(--navy);user-select:none;font-family:Fredoka,Nunito,sans-serif}
.scene{position:absolute;left:0;top:0;width:1600px;height:900px;z-index:0}
.s16 .cl{position:absolute;z-index:1;background:#fff;border-radius:999px;opacity:.85;animation:dr linear infinite}.s16 .cl:before,.s16 .cl:after{content:"";position:absolute;background:#fff;border-radius:50%}
.s16 .cl:before{width:55%;height:150%;left:15%;top:-70%}.s16 .cl:after{width:40%;height:120%;left:48%;top:-45%}@keyframes dr{from{transform:translateX(-300px)}to{transform:translateX(1900px)}}
.main{position:absolute;left:0;top:0;width:1600px;height:900px;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:30px;padding:76px 0 36px;text-align:center}
.top{position:absolute;top:104px;left:0;right:0;display:flex;justify-content:center;z-index:4}
.s16>.mascot{position:absolute;left:-20px;bottom:-44px;width:520px;height:auto;pointer-events:none;z-index:6;background:transparent}
.prog{position:absolute;top:20px;left:50%;transform:translateX(-50%);display:flex;gap:12px;align-items:center;z-index:4;padding:10px 24px;border-radius:40px;background:rgba(255,255,255,.6)}
.prog i{width:18px;height:18px;border-radius:50%;background:rgba(22,50,79,.2)}.prog i.d{background:#FFC83D}.prog i.n{width:32px;height:32px;background:#FF8A5B;box-shadow:0 0 0 6px rgba(255,138,91,.35)}
.spinv{border-radius:44px;background-color:#EAF4FF;background-repeat:no-repeat;box-shadow:0 14px 0 #9ec9ea,0 26px 40px rgba(20,50,90,.28);cursor:pointer}.spinv.on{animation:spinx 6s steps(24) infinite}@keyframes spinx{to{background-position-x:var(--sw)}}.spth{width:112px;height:112px;border-radius:22px;overflow:hidden;background:#fff;box-shadow:0 6px 0 #9ec9ea;cursor:pointer;opacity:.75}.spth.on{opacity:1;box-shadow:0 6px 0 #FFC83D,0 0 0 5px #FFC83D}.spth img{width:100%;height:100%;object-fit:cover}
.score{position:absolute;top:20px;right:30px;z-index:4;font:700 44px Fredoka,sans-serif;background:#fff;border-radius:40px;padding:2px 24px 2px 16px;color:#D98A00;box-shadow:0 6px 0 #ffd66b;display:flex;align-items:center;gap:8px}
.pic{display:inline-flex;align-items:center;justify-content:center;background:#fff;border-radius:38px;box-shadow:0 14px 0 var(--c,#9ec9ea),0 26px 40px rgba(20,50,90,.28);overflow:hidden}
.pic svg,.pic img{width:100%;height:100%;object-fit:contain}
.bigp{width:740px;height:430px}.midp{width:290px;height:290px}.smp{width:200px;height:200px}
.wd{font:700 190px/1 Fredoka,sans-serif;color:#fff;-webkit-text-stroke:18px var(--ink);paint-order:stroke fill;text-shadow:0 12px 0 var(--ink)}
.q1{font:700 98px/1.1 Fredoka,sans-serif;color:#fff;-webkit-text-stroke:14px var(--ink);paint-order:stroke fill;text-shadow:0 8px 0 var(--ink);max-width:1400px}
.t2{font:700 54px Fredoka,sans-serif;color:var(--ink);background:rgba(255,255,255,.8);padding:6px 38px;border-radius:44px}
.row{display:flex;gap:34px;align-items:center;justify-content:center}.g2{display:grid;grid-template-columns:repeat(2,330px);gap:34px}
.card{background:#fff;border-radius:38px;padding:14px;cursor:pointer;box-shadow:0 12px 0 #9ec9ea,0 22px 34px rgba(20,50,90,.25);transition:transform .12s}
.card:hover{transform:translateY(-6px)}.card:active{transform:translateY(8px)}
.card .pic{box-shadow:none;border-radius:26px}
.card.ok{background:#dcf7e0;box-shadow:0 12px 0 #3aa75a,0 22px 34px rgba(20,50,90,.25);animation:jump .5s}.card.no{background:#fde4e2;box-shadow:0 12px 0 #d9534f,0 22px 34px rgba(20,50,90,.25);animation:wob .5s}
.door{width:310px;height:340px;border-radius:30px;background:linear-gradient(#EF5B45,#C8402C);box-shadow:0 14px 0 #8f2a1c,0 26px 36px rgba(0,0,0,.25);color:#fff;font:700 150px Fredoka,sans-serif;display:flex;align-items:center;justify-content:center;flex-direction:column;cursor:pointer;position:relative;text-shadow:0 8px 0 rgba(0,0,0,.2)}
.door:before{content:"";position:absolute;left:20px;top:20px;right:20px;bottom:20px;border:8px solid rgba(255,255,255,.5);border-radius:18px}

 else if(r==='scratch')h=B('Reveal all','scall','','y')+B('Next picture','scnew','','g')+`<span class="lab">Stars: ${S.ts}</span>`;
 else if(r==='link')h=B('Again','lknew','','y')+B('Say again','lksay','','g')+`<span class="lab">Stars: ${S.ts}</span>`;
 else if(r==='sense')h=B('Next','sennew','','y')+B('Say again','sensay','','g')+`<span class="lab">Stars: ${S.ts}</span>`;
 else if(r==='odd')h=B('Next','onew','','y')+B('Say again','osay','','g')+`<span class="lab">Stars: ${S.ts}</span>`;
 else if(r==='count')h=B('Race 30s','rstart','','o')+B(S.teams?'Teams: ON':'Teams: off','teams','','g')+B('Next','cnew','','y')+`<span class="lab">Stars: ${S.ts}</span>`;
 else if(r==='balloons')h=B('Start','bstart','','y')+B('Reset','bnew','','g')+B('Say target','bsay','','g')+`<span class="lab">Stars: ${S.ts}</span>`;
 else if(r==='shadow')h=B('Race 30s','rstart','','o')+B(S.teams?'Teams: ON':'Teams: off','teams','','g')+B('Next shadow','snew','','y')+B('Say again','ssay','','g')+`<span class="lab">Stars: ${S.ts}</span>`;
 else if(r==='memory')h=B('Race 60s','rstart','','o')+B('New game','mnew','','y')+`<span class="lab">Stars: ${S.ts}</span>`;
 else if(r==='yt'&&!YTOK)h=mediaDrop()+`<button class="b y" onclick="openSong()">Open song in new window</button><span class="lab">YouTube cannot play inside this preview page. Press Open song, then drag that window onto the TV (it plays inside the page once the site is on its own web address).</span>`
 else if(r==='yt')h=mediaDrop()+B('Play','ytplay','','y')+B('Pause','ytpause','','g')+`<a href="https://www.youtube.com/watch?v=${(YL()[S.yi]||YL()[0]).id}" target="_blank" style="margin-left:10px;font-size:14px">Open on YouTube</a>`
 else if(r==='clips')h=mediaDrop()+B('Play','vplay','','y')+B('Pause','vpause','','g')+B('Restart','vreset','','g')
 else if(r==='real')h=L.words.map((x,i)=>B(x,'rw',i,i===(S.rw||0)?'y':'g')).join('')+B('Play','vplay','','y')+B('Pause','vpause','','g')
 else if(r==='tapoff')h=B('Reset tap','tapreset','','g');
 $('ctl').innerHTML=h}
function fmt(s){s=Math.abs(s);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function drawTimer(){const t=$('timer');t.textContent=(left<0?'+':'')+fmt(left);t.classList.toggle('late',left<0)}
function tgl(){run=!run;$('pbtn').textContent=run?'Pause':'Resume'}
let EDN=ED0.length;
function edSync(){const ed=S.ed||[];while(EDN<ed.length){edApply(L,ed[EDN]);EDN++}if(VIEW==='student')rebuildList();else rebuildRail()}
function groups(){const g=[];L.stages.forEach((s,i)=>{let x=g[g.length-1];if(!x||x.p!==s.phase){x={p:s.phase,f:s.frame,m:0,i:[]};g.push(x)}x.m+=s.min;x.i.push(i)});return g}
function rebuildRail(){const r=$('rail');if(!r)return;r.innerHTML=groups().map(g=>`<div class="ph"><div class="phh"><b>${g.p||'Lesson'}</b><span>${g.m} min</span></div>${g.f?`<div class="phf">${g.f}</div>`:''}${g.i.map(i=>{const s=L.stages[i],rm=canRemove(L,i),sw=optionsFor(L,i).length>1;return `<div class="sr"><button class="st" id="st${i}" onclick="goSt(${i})">${i+1}. ${s.name}<small>${s.min} min</small></button><span class="sw">${sw?`<button title="Swap this activity" onclick="edUI('swap',${i})">&#8644;</button>`:''}<button title="${rm?'Remove':'Can\'t remove: keep one song or dance, and one activity in each stage. Swap it instead.'}" ${rm?'':'disabled'} onclick="edDo({t:'rm',i:${i}})">&#10005;</button></span></div>`}).join('')}<button class="addb" onclick="edUI('add','${g.p}')">+ add activity</button></div>`).join('');stHL()}
function rebuildList(){const l=$('slist');if(!l)return;const tp=VIEW==='student'?`send({type:'act',a:'nav',p:`:`goSt(`;const end=VIEW==='student'?`})`:`)`;l.innerHTML=L.stages.map((s,i)=>`<button id="sl${i}" onclick="${tp}${i}${end};document.getElementById('slist').classList.remove('open')">${i+1}. ${s.name}</button>`).join('');const b=$('sl'+S.st);if(b)b.classList.add('on')}
function edDo(op){act('ed',op)}
function edUI(kind,x){const m=$('edm');let rows,title;
 if(kind==='swap'){const cur=L.stages[x];title='Swap: '+cur.name;rows=optionsFor(L,x).map(o=>`<button class="eo ${o.kind===cur.kind?'cur':''}" onclick="edPick({t:'swap',i:${x},k:'${o.kind}'})"><b>${o.name}</b><small>${o.len}${o.prep?' · '+o.prep:''}${o.song?' · song/dance':''}</small></button>`)}
 else{title='Add to '+x;rows=addOptions(L,x).map(o=>`<button class="eo" onclick="edPick({t:'add',p:'${x}',k:'${o.kind}',u:'${o.pur}'})"><b>${o.name}</b><small>${o.len}${o.prep?' · '+o.prep:''}${o.song?' · song/dance':''}</small></button>`);if(!rows.length)rows=['<div class="eo">Nothing else fits this stage.</div>']}
 m.innerHTML=`<div class="edb"><h3>${title}</h3><div class="edn">Stage time stays the same.</div>${rows.join('')}<button class="eo x" onclick="$('edm').style.display='none'">Cancel</button></div>`;m.style.display='flex'}
function edPick(op){$('edm').style.display='none';edDo(op)}
function goSt(i){act('goto',i);const s=L.stages[i];left=s.min*60;run=true;$('pbtn').textContent='Pause';
 $('teach').innerHTML=`<h2>${s.name}</h2><div class="m">${s.phase?`<span class="phase">${s.phase}</span> `:''}${s.min} minute${s.min>1?'s':''} · stage ${i+1} of ${L.stages.length}</div>`+s.steps.map(p=>`<label class="step"><input type="checkbox"><span>${p.do}${p.say?`<span class="say">“${p.say}”</span>`:''}</span></label>`).join('')+(s.frame?`<div class="box frame"><b>Method:</b> ${s.frame}</div>`:'')+`<div class="box watch"><b>Watch for:</b> ${s.watch}</div><div class="box short"><b>Short on time:</b> ${s.short}</div>`;drawTimer()}
function nextSt(d){const n=S.st+d;if(n>=0&&n<L.stages.length)goSt(n)}
function begin(){$('start').style.display='none';goSt(0)}
function full(){const c=$('cls'),on=!c.classList.contains('full'),de=document.documentElement;c.classList.toggle('full',on);if(!on)c.classList.remove('ctlopen');
 if(on){try{(de.requestFullscreen||de.webkitRequestFullscreen||function(){}).call(de)}catch(e){}try{screen.orientation.lock('landscape').catch(()=>{})}catch(e){}}
 else{try{if(document.fullscreenElement)document.exitFullscreen()}catch(e){}try{screen.orientation.unlock()}catch(e){}}
 fitPv()}
document.addEventListener('fullscreenchange',()=>{const c=$('cls');if(!document.fullscreenElement&&c&&c.classList.contains('full')){c.classList.remove('full','ctlopen');try{screen.orientation.unlock()}catch(e){}fitPv()}});
function fitPv(){setTimeout(()=>fit($('pv')),30);[150,500,1200].forEach(t=>setTimeout(()=>{const b=$('pv');if(b)fit(b)},t))}
['orientationchange','fullscreenchange'].forEach(e=>addEventListener(e,()=>{if(VIEW!=='student')fitPv()}));if(window.visualViewport)visualViewport.addEventListener('resize',()=>{if(VIEW!=='student')fitPv()});
function openStudent(){const u=location.href.split('#')[0]+'#student';window.open(u,'k1student','width=1280,height=720')}
function updWait(){}
addEventListener('resize',()=>{if(VIEW==='student')fitFull();else fitPv()});
document.addEventListener('keydown',e=>{if(VIEW==='teacher'&&$('cls').classList.contains('full')){if(e.key==='Escape')full();if(e.key==='ArrowRight')nextSt(1);if(e.key==='ArrowLeft')nextSt(-1)}});
// ---------- build the page ----------
if(VIEW==='student'){
 document.body.style.cssText='background:#0B1B33;align-items:center;justify-content:center';
 document.body.innerHTML=`<div class="fit" id="sv"><div class="s16"></div></div><div class="wait" id="wt" style="cursor:pointer">Tap here to start the class screen<br><small style="font-size:22px">Then press Start on the teacher page. (This tap lets sounds and video play.)</small></div>`;
 document.body.insertAdjacentHTML('beforeend',`<div id="snav"><button onclick="send({type:'act',a:'navstep',p:-1})" aria-label="Back">&#9664;</button><button id="smenu" onclick="document.getElementById('slist').classList.toggle('open')" aria-label="Menu">&#9776;</button><button onclick="send({type:'act',a:'navstep',p:1})" aria-label="Next">&#9654;</button></div><div id="slist">${L.stages.map((s,i)=>`<button id="sl${i}" onclick="send({type:'act',a:'nav',p:${i}});document.getElementById('slist').classList.remove('open')">${i+1}. ${s.name}</button>`).join('')}</div>`);
 let _nt;const _nv=()=>{const n=$('snav');n.classList.add('show');clearTimeout(_nt);_nt=setTimeout(()=>{n.classList.remove('show')},4500)};addEventListener('pointerdown',_nv);addEventListener('mousemove',_nv);addEventListener('keydown',e=>{if(e.key==='ArrowRight')send({type:'act',a:'navstep',p:1});if(e.key==='ArrowLeft')send({type:'act',a:'navstep',p:-1})});
 const hi=()=>send({type:'hi'});hi();setInterval(hi,3000);
 $('wt').onclick=()=>{$('wt').remove();hi()};
 fitFull();
}else{
 document.body.insertAdjacentHTML('beforeend',`<div id="start">${L.mascot&&L.mascot.hello?`<video src="${L.mascot.hello}" autoplay muted playsinline loop style="width:280px"></video>`:''}<div style="font-size:18px;color:#b9d3e8">${L.sub}</div><h1>${L.title}</h1><div style="font-size:18px;max-width:700px">${L.objective}</div><div style="font-size:20px;font-weight:bold;margin-top:8px">Before you start</div><ul>${L.prep.map(p=>`<li>${p}</li>`).join('')}</ul><button class="b y" style="font-size:22px;padding:12px 26px" onclick="begin()">Start lesson</button><div class="acs-foot" style="position:absolute;left:0;right:0;bottom:0;margin:0;border-radius:0;padding:8px 14px"><span class="m1">Labor omnia vincit</span><span class="m2">Work conquers all</span><span class="m3">Empowering Learning Through AI &amp; Innovation, for Student Well-Being</span></div></div>
 <div id="top"><div><h1>${L.title}</h1><div class="sub">${L.sub}</div></div><span style="flex:1"></span><div id="timer">00:00</div><button class="b y" id="pbtn" onclick="tgl()">Pause</button><button class="b g" onclick="nextSt(-1)">Back stage</button><button class="b g" onclick="nextSt(1)">Next stage</button><button class="b" onclick="openStudent()">Open student screen</button></div>
 <div id="wrap"><div id="rail"></div><div id="edm"></div>
 <div id="teach"></div><div id="cls"><div class="lab">Class screen (what the children see)</div><div class="fit" id="pv"><div class="s16"></div></div><div id="saynow"></div><div id="ctl"></div><div id="snav" style="opacity:.7"><button onclick="nextSt(-1)" aria-label="Back">&#9664;</button><button onclick="document.getElementById('slist').classList.toggle('open')" aria-label="Menu">&#9776;</button><button onclick="nextSt(1)" aria-label="Next">&#9654;</button></div><div id="slist">${L.stages.map((s,i)=>`<button id="sl${i}" onclick="goSt(${i});document.getElementById('slist').classList.remove('open')">${i+1}. ${s.name}</button>`).join('')}</div><div id="rotmsg">&#128241; Turn your phone sideways</div><button class="b y" id="fsbtn" onclick="full()">Full screen (one screen only)</button><button class="b y" id="ctlbtn" aria-label="Controls" title="Controls" onclick="document.getElementById('cls').classList.toggle('ctlopen')">&#9881;<span class="cl"> Controls</span></button><button class="b y" id="exitfs" aria-label="Back to teacher view" title="Back to teacher view" onclick="full()">&#10005;<span class="exl"> Back to teacher view</span></button></div></div>`);
 rebuildRail();
 setInterval(()=>{if(run){left--;drawTimer()}},1000);
 fit($('pv'));draw();
}
</script></body></html>
