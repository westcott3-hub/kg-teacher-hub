<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lesson Plan | Assumption College Sriracha</title><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="brand.css">
<style>
*{box-sizing:border-box}
body{font-family:Nunito,Arial,sans-serif;font-size:13px;color:#1F2328;margin:0;padding:16px;max-width:920px;margin:auto;background:#F5F5F3}
h1{color:#16324F;font-size:24px;font-weight:900;margin:0 0 4px}h2{color:#16324F;font-size:18px;margin:22px 0 8px}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;background:#fff}td,th{border:1px solid #E7E5E1;padding:6px 9px;vertical-align:top;text-align:left}
th{background:#16324F;color:#fff}.phr{background:#FEF2F2;color:#B91C1C}.k{background:#F5F5F3;font-weight:800;width:150px}.say{color:#B91C1C}.ph{color:#B91C1C;font-style:italic;font-size:11px}
.bar{background:#fff;border:1px solid #E7E5E1;padding:8px 12px;border-radius:10px;margin-bottom:14px;display:flex;gap:8px;flex-wrap:wrap}
button{padding:9px 16px;font-size:14px;font-weight:800;font-family:inherit;border-radius:10px;border:1.5px solid #1F2328;background:#fff;cursor:pointer}button:first-child{background:#B91C1C;border-color:#B91C1C;color:#fff}
@media(max-width:600px){body{padding:10px}td,th{padding:5px 6px}.k{width:96px}h1{font-size:20px}}
@media print{.bar{display:none}body{background:#fff}}
</style></head><body>
<div class="acs-bar" style="margin-top:4px"><img src="acs_logo.png" alt="ACS"><div><div class="n1">Assumption College Sriracha</div><div class="n2">Kindergarten Lesson Plan</div></div></div>
<div class="bar"><button onclick="dl()">Download Word (.docx)</button><button onclick="print()">Print / save as PDF</button></div>
<div id="o"></div><div class="acs-foot"><span class="m1">Labor omnia vincit</span><span class="m2">Work conquers all</span><span class="m3">Empowering Learning Through AI &amp; Innovation, for Student Well-Being</span></div>
<script src="engine.js"></script><script src="docx.js"></script>
<script>
const Q=new URLSearchParams(location.search);const L=makeLesson(Q.get('t')||'farm',Q.get('m')||'ipdpc',+(Q.get('min')||30),Q.get('s')||'1',Q.get('own')==='1');edDec(Q.get('ed')||'').forEach(op=>edApply(L,op));
const e=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
const tot=L.stages.reduce((a,s)=>a+s.min,0);const PM={};L.stages.forEach(s=>PM[s.phase]=(PM[s.phase]||0)+s.min);const first=i=>i===0||L.stages[i-1].phase!==L.stages[i].phase;
let h=`<h1>K1 English Lesson Plan: ${e(L.title)}</h1><div style="color:#555;font-style:italic;margin-bottom:10px">${e(L.sub)}</div><table>
<tr><td class=k>Teacher</td><td>${e(L.teacher||'')}</td></tr><tr><td class=k>Level</td><td>K1 (age 3)</td></tr>
<tr><td class=k>Teaching method</td><td>${e(L.method)}</td></tr><tr><td class=k>Time</td><td>${tot} minutes</td></tr>
<tr><td class=k>Target words</td><td>${L.words.map(e).join(', ')}</td></tr><tr><td class=k>Objective</td><td>${e(L.objective||'')}</td></tr>
<tr><td class=k>Materials</td><td>${(Array.isArray(L.prep)?L.prep:[L.prep||'']).map(x=>'• '+e(x)).join('<br>')}</td></tr></table>
<h2>Lesson stages</h2><div class=tw><table><tr><th>#</th><th>Stage</th><th>Min</th><th>What to do / say</th></tr>`;
L.stages.forEach((s,i)=>{if(first(i))h+=`<tr><td colspan=4 class=phr><b>${e(s.phase)} · ${PM[s.phase]} min</b>${s.frame?' — '+e(s.frame):''}</td></tr>`;h+=`<tr><td>${i+1}</td><td><b>${e(s.name)}</b></td><td>${s.min}</td><td>`+s.steps.map(t=>`<div>${e(t.do)}</div>`+(t.say?`<div><b class=say>Say: </b><i>${e(t.say)}</i></div>`:'')).join('')+(s.watch?`<div><b>Watch for: </b>${e(s.watch)}</div>`:'')+(s.short?`<div><b>Short on time: </b>${e(s.short)}</div>`:'')+'</td></tr>'});
h+='</table></div>';
if(L.chant&&L.chant.length){h+=`<h2>${e(L.title)} chant</h2>`+L.chant.map((l,i)=>`<div><b>${e(l)}</b> <i style="color:#555">Action: ${e((L.chantActions||[])[i]||'')}</i></div>`).join('')}
h+=`<h2>Assessment (informal)</h2><div>Tick who can say or mime each word: ${L.words.map(e).join(', ')}. Praise any sound or mime.</div>`;
document.title=L.title+' plan';document.getElementById('o').innerHTML=h;

async function dl(){
const d=window.docx,{Document,Packer,Paragraph,TextRun,Table,TableRow,TableCell,WidthType,ShadingType,BorderStyle,HeadingLevel}=d;
const F='Arial',W=10466;
const p=(t,o={})=>new Paragraph({spacing:{after:80},...o,children:[new TextRun({text:t,font:F,size:21,...(o.r||{})})]});
const rich=(runs,o={})=>new Paragraph({spacing:{after:60},...o,children:runs.map(r=>new TextRun({font:F,size:21,...r}))});
const bd={style:BorderStyle.SINGLE,size:4,color:'BBBBBB'};const B={top:bd,bottom:bd,left:bd,right:bd};
const cell=(kids,w,fill)=>new TableCell({width:{size:w,type:WidthType.DXA},borders:B,margins:{top:70,bottom:70,left:110,right:110},shading:fill?{type:ShadingType.CLEAR,fill,color:'auto'}:undefined,children:kids});
const kv=rows=>new Table({width:{size:W,type:WidthType.DXA},columnWidths:[2300,W-2300],rows:rows.map(([a,b])=>new TableRow({children:[cell([p(a,{r:{bold:true}})],2300,'E8F1FB'),cell(Array.isArray(b)?b:[p(b)],W-2300)]}))});
const h=t=>new Paragraph({heading:HeadingLevel.HEADING_1,children:[new TextRun({text:t,font:F})]});
const kids=[new Paragraph({heading:HeadingLevel.TITLE,children:[new TextRun({text:`K1 English Lesson Plan: ${L.title}`,font:F})]}),p(L.sub||'',{r:{italics:true,color:'555555'}})];
kids.push(kv([['Teacher',L.teacher||''],['Level','K1 (age 3)'],['Teaching method',L.method],['Time',tot+' minutes'],['Target words',L.words.join(', ')],['Objective',L.objective||''],['Materials',(Array.isArray(L.prep)?L.prep:[L.prep||'']).map(x=>p('• '+x))],['Lesson player','Open the lesson player on the laptop (teacher view) and the student view on the TV. Use Chrome or Edge.']]));
kids.push(h('Lesson stages'));
const cw=[500,2000,700,W-3200];
const hdr=new TableRow({tableHeader:true,children:['#','Stage','Min','What to do / say'].map((t,i)=>cell([p(t,{r:{bold:true,color:'FFFFFF'}})],cw[i],'2E6DA4'))});
const rows=L.stages.flatMap((s,i)=>{const k=[];s.steps.forEach(st=>{k.push(rich([{text:st.do}]));if(st.say)k.push(rich([{text:'Say: ',bold:true,color:'2E6DA4'},{text:st.say,italics:true}]))});
 if(s.watch)k.push(rich([{text:'Watch for: ',bold:true},{text:s.watch}]));if(s.short)k.push(rich([{text:'Short on time: ',bold:true},{text:s.short}]));
 const row=new TableRow({children:[cell([p(String(i+1))],cw[0]),cell([p(s.name,{r:{bold:true}})],cw[1]),cell([p(String(s.min))],cw[2]),cell(k,cw[3])]});
 if(!first(i))return [row];
 const hc=new TableCell({columnSpan:4,width:{size:W,type:WidthType.DXA},borders:B,margins:{top:70,bottom:70,left:110,right:110},shading:{type:ShadingType.CLEAR,fill:'DCEBF7',color:'auto'},children:[rich([{text:s.phase+' · '+PM[s.phase]+' min',bold:true,color:'1F4E79'},{text:s.frame?'  '+s.frame:'',italics:true}])]});
 return [new TableRow({children:[hc]}),row]});
kids.push(new Table({width:{size:W,type:WidthType.DXA},columnWidths:cw,rows:[hdr,...rows]}));
if(L.chant&&L.chant.length){kids.push(h(L.title+' chant'));L.chant.forEach((l,i)=>kids.push(rich([{text:l,bold:true},{text:'   Action: '+((L.chantActions||[])[i]||''),italics:true,color:'555555'}])))}
kids.push(h('Assessment (informal)'),p('Tick who can say or mime each word: '+L.words.join(', ')+'. Praise any sound or mime.'));
const st=n=>({run:{font:F,size:n[0],bold:true,color:'1F4E79'},paragraph:{spacing:{before:n[1],after:n[2]},keepNext:true}});
const doc=new Document({styles:{default:{document:{run:{font:F,size:21}}},paragraphStyles:[{id:'Title',name:'Title',basedOn:'Normal',run:{font:F,size:40,bold:true,color:'1F4E79'},paragraph:{spacing:{after:80}}},{id:'Heading1',name:'Heading 1',basedOn:'Normal',next:'Normal',quickFormat:true,...st([28,280,120])}]},sections:[{properties:{page:{size:{width:11906,height:16838},margin:{top:720,bottom:720,left:720,right:720}}},children:kids}]});
const blob=await Packer.toBlob(doc);const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='K1_'+L.title.replace(/\W+/g,'_')+'_'+(Q.get('m')||'ipdpc')+'_'+tot+'min_Lesson_Plan.docx';document.body.appendChild(a);a.click();a.remove()}
</script></body></html>
