<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lesson Plan | Assumption College Sriracha</title><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="brand.css">
<style>
*{box-sizing:border-box}
body{font-family:Nunito,Arial,sans-serif;font-size:13px;color:#1F2328;margin:0;padding:16px;max-width:1500px;margin:auto;background:#F5F5F3}
h1{color:#16324F;font-size:24px;font-weight:900;margin:0 0 4px}h2{color:#16324F;font-size:18px;margin:22px 0 8px}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;background:#fff}td,th{border:1px solid #E7E5E1;padding:6px 9px;vertical-align:top;text-align:left}
th{background:#fff;color:#000;text-align:center}table.six{min-width:1100px;table-layout:fixed}table.six td,table.six th{border:1px solid #000;font-family:"TH Sarabun New",Arial,sans-serif;font-size:14px;vertical-align:top}table.hd td,table.sg td{border:none;font-size:15px}table.hd{width:100%;background:none}table.sg{margin-top:12px;text-align:center}table.sg td{width:50%}th{background:#fff;color:#000;text-align:center}.phr{background:#FEF2F2;color:#B91C1C}.k{background:#F5F5F3;font-weight:800;width:150px}.say{color:#B91C1C}.ph{color:#B91C1C;font-style:italic;font-size:11px}
.bar{background:#fff;border:1px solid #E7E5E1;padding:8px 12px;border-radius:10px;margin-bottom:14px;display:flex;gap:8px;flex-wrap:wrap}
button{padding:9px 16px;font-size:14px;font-weight:800;font-family:inherit;border-radius:10px;border:1.5px solid #1F2328;background:#fff;cursor:pointer}button:first-child{background:#B91C1C;border-color:#B91C1C;color:#fff}
@media(max-width:600px){body{padding:10px}td,th{padding:5px 6px}.k{width:96px}h1{font-size:20px}}
@page{size:A4 landscape;margin:10mm}@media print{.bar{display:none}body{background:#fff}}
</style></head><body>
<div class="acs-bar" style="margin-top:4px"><img src="acs_logo.png" alt="ACS"><div><div class="n1">Assumption College Sriracha</div><div class="n2">Kindergarten Lesson Plan</div></div></div>
<div class="bar"><button onclick="dl()">Download Word (school template)</button><button onclick="print()">Print / save as PDF</button><input id="iw" placeholder="Week no." size="7"><input id="iu" placeholder="Unit" size="7"><input id="id" placeholder="Date, e.g. 26 Nov 2026" size="20"></div>
<div id="o"></div><div class="acs-foot"><span class="m1">Labor omnia vincit</span><span class="m2">Work conquers all</span><span class="m3">Empowering Learning Through AI &amp; Innovation, for Student Well-Being</span></div>
<script src="engine.js"></script><script src="themes.js"></script><script src="jszip.min.js"></script><script src="acs-template.js"></script>
<script>
const Q=new URLSearchParams(location.search);if(window.KGT)KGT.prep(DATA,LESSONS,Q.get('t')||'farm');const L=makeLesson(Q.get('t')||'farm',Q.get('m')||'ipdpc',+(Q.get('min')||30),Q.get('s')||'1',Q.get('own')==='1');edDec(Q.get('ed')||'').forEach(op=>edApply(L,op));
const e=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
const tot=L.stages.reduce((a,s)=>a+s.min,0);
const RES=L.stages.map(s=>s.res),has=(...k)=>k.some(x=>RES.includes(x));
const subj=(L.sub||'').split(' · ')[0].replace(/^K\d\s*/,'')||'English';
// ---- content for the school's six-column template (same wording and tick boxes as the school's plans) ----
const sents=(L.objective||'').split(/(?<=[.!?])\s+/).filter(Boolean);
const KLV=((L.level||'K1').match(/K(\d)/)||[0,'1'])[1];
const OBJ=[['At the end of lesson, the pupils should be able to:']].concat(sents.map((t,i)=>[(i+1)+'. '+t.replace(/^Children can /,'Pupils can ').replace(/^Children /,'Pupils ')]));
const wsay=(L.wordSay||'').trim();
const sentences=[wsay?wsay+' ('+L.words[0]+').':'',L.hello&&L.hello.q?L.hello.q:'',L.hello&&L.hello.t?L.hello.t:''].filter(Boolean).join(' / ');
const motor=has('mime','build2d','buildguide','draw','chant')||L.stages.some(s=>/dance/i.test(s.name));
const social=has('sense','wheel','balloons','tap','find','memory','missing','mime','shadow','odd','count','doors','scratch');
const CONTENT=[[{t:'2.1 Knowledge',b:1}],['Vocabulary: '+L.words.join(', ')],['Sentences: '+(sentences||'')],[{t:'2.2 Development',b:1}],['☑ 1. Language'],['☐ 2. Emotional'],[(social?'☑':'☐')+' 3. Social']];
const MOTOR=[[(motor?'☑':'☐')+' 4. Motor Skills']];
const prep=(Array.isArray(L.prep)?L.prep:[L.prep||'']).filter(x=>x&&!/^Open this page|^Press 'Open student/i.test(x));
const tv=L.stages.map(s=>s.name).filter((x,i,a)=>!/^(Welcome|Goodbye|Hello|Time to go)/.test(x)&&a.indexOf(x)===i).map(x=>x.replace(/\s*\(.*\)$/,''));
const other=['digital word cards, songs and games on the TV'].concat(prep).join('; ');
const ck=(on,t)=>(on?'☑':'☐')+' '+t;
const MAT=[ck(0,'Book'),ck(0,'Story book'),ck(has('buildguide'),'Toys'),ck(has('draw'),'Worksheet'),ck(has('clips','yt','vgames'),'Video'),ck(has('real','spin','solids'),'Real objects'),ck(has('words'),'Flashcards'),ck(has('yt','chant','clips'),'Song'),'☑ Other: '+other].map(x=>[x]);
const METHS=[ck(0,'Lecture'),ck(1,'Demonstration'),ck(0,'Experiment'),ck(0,'Deduction'),ck(0,'Induction'),ck(0,'Field trip'),ck(0,'Case'),ck(has('wheel','balloons','tap','find','memory','missing','shadow','odd','count','doors','scratch','zoom','mime'),'Game'),ck(has('mime'),'Dramatization')].map(x=>[x]);
const EVAL=[ck(1,'Participation'),ck(1,'Vocabulary recall'),ck(has('draw'),'Workbook completion'),ck(1,'Following instructions')].map(x=>[x]);
// teaching process: phase headings, numbered stages, " - " sub-steps
const PM={};L.stages.forEach(s=>PM[s.phase]=(PM[s.phase]||0)+s.min);
const PROC=[[{t:'Lesson – '+L.title+' ('+tot+' minutes)',b:1,hl:1}]];
L.stages.forEach((s,i)=>{if(i===0||L.stages[i-1].phase!==s.phase)PROC.push([{t:s.phase+' ('+PM[s.phase]+' minutes)',b:1,i:1}]);
 PROC.push([(i+1)+'. '+s.name+' ('+s.min+' min):']);
 s.steps.forEach(st=>{PROC.push([' - '+st.do+(st.say?' Say: “'+st.say+'”':'')])});
});
if(L.chant&&L.chant.length){PROC.push([{t:'Chant: '+L.title,b:1,i:1}]);L.chant.forEach((l,k)=>PROC.push([' - '+l+((L.chantActions||[])[k]?'  ('+L.chantActions[k]+')':'')]))}
const fields=()=>({week:document.getElementById('iw').value.trim()||'……',unit:document.getElementById('iu').value.trim()||'……',date:document.getElementById('id').value.trim()||'………………'});
// ---- on-screen preview in the same six-column layout ----
const cellH=ls=>ls.map(l=>'<div>'+l.map(r=>typeof r==='string'?e(r):`<span style="${r.b?'font-weight:800;':''}${r.i?'font-style:italic;':''}${r.hl?'background:#D9D9D9;':''}">${e(r.t)}</span>`).join('')+'</div>').join('');
const ph=(x,l)=>`<input oninput="" style="display:none">`;
let h=`<div style="text-align:center;font-weight:800;font-size:18px;margin:6px 0">Assumption College Sriracha<br>Kindergarten Lesson Plan</div>
<table class="hd"><tr><td><b>Learning Area of Foreign Languages</b></td><td></td><td><b>Subject:</b> ${e(subj)}</td></tr><tr><td><b>Academic Year: 2026</b></td><td><b>Semester 2</b></td><td><b>Class:</b> Kindergarten ${KLV}</td></tr><tr><td><b>Date:</b> <span id="pd">………</span></td><td><b>Week:</b> <span id="pw">……</span></td><td></td></tr><tr><td><b>Unit:</b> <span id="pu">……</span></td><td colspan=2><b>Topic:</b> ${e(L.title)}</td></tr></table>
<div class=tw><table class="six"><colgroup><col style="width:13%"><col style="width:12%"><col style="width:14%"><col style="width:9%"><col style="width:42%"><col style="width:10%"></colgroup><tr><th>1. Objectives</th><th>2. Learning Content</th><th>3. Materials/ Innovation/ Learning Resources</th><th>4. Teaching Methods</th><th>5. Teaching Process</th><th>6. Evaluation</th></tr>
<tr><td>${cellH(OBJ)}</td><td>${cellH(CONTENT.concat(MOTOR))}</td><td>${cellH(MAT)}</td><td>${cellH(METHS)}</td><td>${cellH(PROC)}</td><td>${cellH(EVAL)}</td></tr></table></div>
<table class="sg"><tr><td>Sign ……………………<br>(Teacher ………………………)<br>Instructor</td><td>Sign ……………………<br>(Miss Wassana Pornying)<br>Head of Kindergarten</td></tr></table>`;
document.title=L.title+' plan';document.getElementById('o').innerHTML=h;
['iw:pw','iu:pu','id:pd'].forEach(x=>{const [a,b]=x.split(':');document.getElementById(a).addEventListener('input',()=>{document.getElementById(b).textContent=document.getElementById(a).value||'……'})});
// ---- Word: fill the school's own template file ----
const X=t=>String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const RP=(b,i,hl)=>'<w:rPr><w:rFonts w:ascii="TH SarabunPSK" w:hAnsi="TH SarabunPSK" w:cs="TH SarabunPSK"/>'+(b?'<w:b/><w:bCs/>':'')+(i?'<w:i/><w:iCs/>':'')+'<w:color w:val="000000"/><w:sz w:val="22"/><w:szCs w:val="26"/>'+(hl?'<w:highlight w:val="lightGray"/>':'')+'</w:rPr>';
const PX=ls=>ls.map(l=>'<w:p><w:pPr><w:spacing w:after="0"/>'+RP(0,0,0)+'</w:pPr>'+l.map(r=>{r=typeof r==='string'?{t:r}:r;return '<w:r>'+RP(r.b,r.i,r.hl)+'<w:t xml:space="preserve">'+X(r.t)+'</w:t></w:r>'}).join('')+'</w:p>').join('');
async function dl(){
 const f=fields(),z=await JSZip.loadAsync(window.ACS_TPL,{base64:true});let x=await z.file('word/document.xml').async('string');
 const para=(tok,ls)=>{const re=new RegExp('<w:p[ >](?:(?!</w:p>)[\\s\\S])*?\\{\\{'+tok+'\\}\\}[\\s\\S]*?</w:p>');if(!re.test(x))throw new Error('template token '+tok);x=x.replace(re,()=>PX(ls))};
 para('OBJ',OBJ);para('CONTENT',CONTENT);para('MOTOR',MOTOR);para('MATERIALS',MAT);para('METHODS',METHS);para('PROCESS',PROC);para('EVAL',EVAL);
 const rep=(k,v)=>{x=x.split('{{'+k+'}}').join(X(v))};x=x.replace('>Kindergarten 1<','>Kindergarten '+KLV+'<');rep('SUBJECT',subj);rep('DATE',f.date);rep('WEEK',f.week);rep('UNIT',f.unit);rep('TOPIC',L.title);
 z.file('word/document.xml',x);const blob=await z.generateAsync({type:'blob',mimeType:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'});
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='K'+KLV+'_'+L.title.replace(/\W+/g,'_')+'_'+tot+'min_Lesson_Plan.docx';document.body.appendChild(a);a.click();a.remove()}
</script></body></html>
